name: Build Android APK

on:
  push:
    branches-ignore: [screenshots]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Release signing: add the repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD,
      # KEY_ALIAS and KEY_PASSWORD (Settings → Secrets and variables → Actions).
      # Without them the release APK is signed with the debug key.
      - name: Set up release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TERVYN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # The Ubuntu runner already has the Android SDK; Gradle fetches any missing platform.
      - name: Build APKs
        env:
          TERVYN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TERVYN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TERVYN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon -PrequireXray=true assembleDebug assembleRelease lint

      - name: Show APK signing certificate
        continue-on-error: true
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs app/build/outputs/apk/release/app-arm64-v8a-release.apk | grep -iE "certificate (DN|SHA-256)" || true

      - name: Show lint results
        if: always()
        run: cat app/build/reports/lint.txt || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tervyn-vpn-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # Renders every screen in every theme (Paparazzi, no device needed) and
  # publishes the images to the "screenshots" branch for design review.
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Render screenshots
        run: ./gradlew --no-daemon :app:recordPaparazziDebug

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/src/test/snapshots/images/
          if-no-files-found: warn

      - name: Publish to the screenshots branch
        if: github.event_name == 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          cp app/src/test/snapshots/images/*.png "$RUNNER_TEMP/shots/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan screenshots-publish
          git rm -rfq .
          cp "$RUNNER_TEMP/shots/"*.png .
          git add -- *.png
          git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -f origin HEAD:screenshots
