name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Release signing: add the repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD,
      # KEY_ALIAS and KEY_PASSWORD (Settings → Secrets and variables → Actions).
      # Without them the release APK is signed with the debug key.
      - name: Set up release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TERVYN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # The Ubuntu runner already has the Android SDK; Gradle fetches any missing platform.
      - name: Build APKs
        env:
          TERVYN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TERVYN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TERVYN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon -PrequireXray=true assembleDebug assembleRelease lint

      - name: Show APK signing certificate
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs app/build/outputs/apk/release/app-arm64-v8a-release.apk | grep -E "Signer #1 certificate (DN|SHA-256)"

      - name: Show lint results
        if: always()
        run: cat app/build/reports/lint.txt || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tervyn-vpn-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
